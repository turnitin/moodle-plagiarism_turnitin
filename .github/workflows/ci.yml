name: Moodle Plugin CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # Moodle 4.5 LTS — minimum supported version per version.php requires = 2024100700.
          # Supports PHP 8.1–8.3.
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
          # Moodle 5.0 — supports PHP 8.2–8.4.
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
          - php: '8.4'
            moodle-branch: 'MOODLE_500_STABLE'
          # Moodle 5.1 — supports PHP 8.2–8.4.
          - php: '8.2'
            moodle-branch: 'MOODLE_501_STABLE'
          - php: '8.4'
            moodle-branch: 'MOODLE_501_STABLE'
          # Moodle 5.2 — supports PHP 8.3–8.4. Matches the local Docker environment.
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
          - php: '8.4'
            moodle-branch: 'MOODLE_502_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          # Coverage is handled locally via PCOV in Docker; keeping CI fast with none here.
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        # Vendor files and generated AMD bundles are excluded — they're not our code.
        run: moodle-plugin-ci phpcs --max-warnings 0 --ignore-path vendor

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
